name: ERP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zindex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/zindex_test
      NATIVE_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/zindex_test
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked backups and credentials
        run: node server/scripts/check-repository.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npx prisma validate && npx prisma generate
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Install PostgreSQL 18 backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: npm run test:native
        working-directory: server
      - run: npm test && npm run lint -- --max-warnings=0 && npm run build
        working-directory: client
      - name: Build and run the exact production container
        run: |
          docker build --target migration -t zindex-migration-check .
          docker run --rm --network host -e DATABASE_URL zindex-migration-check
          docker build --target production -t zindex-production-check .
          docker run --rm -d --name zindex-smoke --network host -e DATABASE_URL -e JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes -e APP_URL=https://erp.example.invalid -e SUPPORT_EMAIL=support@example.invalid -e SERVICE_OPERATOR_NAME=CI -e BILLING_PROVIDER=manual zindex-production-check
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:7079/ready
          curl --fail http://127.0.0.1:7079/login -o /tmp/zindex-login.html
          curl --fail http://127.0.0.1:7079/api/public/service
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs zindex-smoke 2>/dev/null || true
          docker stop zindex-smoke 2>/dev/null || true
