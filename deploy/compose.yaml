services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: zindex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_DB: zindex
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zindex -d zindex']
      interval: 5s
      retries: 12
  migrate:
    build:
      context: ..
      target: migration
    environment:
      DATABASE_URL: postgresql://zindex:${POSTGRES_PASSWORD}@db:5432/zindex
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: ..
      target: production
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      DATABASE_URL: postgresql://zindex:${POSTGRES_PASSWORD}@db:5432/zindex
      NODE_ENV: production
      UPLOADS_DIR: /data/uploads
      HOST: 0.0.0.0
      TRUST_PROXY_HOPS: 1
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate:
        condition: service_completed_successfully
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  postgres:
  uploads:
  caddy_data:
  caddy_config:
